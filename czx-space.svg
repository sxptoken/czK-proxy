<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="bg"><stop stop-color="#090312"/><stop offset=".55" stop-color="#030107"/><stop offset="1" stop-color="#000"/></radialGradient>
<radialGradient id="neb"><stop stop-color="#9d45ff" stop-opacity=".55"/><stop offset=".45" stop-color="#5a16b8" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".7" filter="url(#soft)">
<ellipse cx="180" cy="160" rx="400" ry="115" fill="url(#neb)" transform="rotate(-25 180 160)"/>
<ellipse cx="1420" cy="180" rx="400" ry="115" fill="url(#neb)" transform="rotate(25 1420 180)"/>
<ellipse cx="210" cy="760" rx="430" ry="125" fill="url(#neb)" transform="rotate(20 210 760)"/>
<ellipse cx="1390" cy="740" rx="430" ry="125" fill="url(#neb)" transform="rotate(-20 1390 740)"/>
</g>
<g fill="#fff" filter="url(#glow)" opacity=".9">
<circle cx="80" cy="100" r="2"/><circle cx="170" cy="310" r="3"/><circle cx="310" cy="90" r="2"/><circle cx="440" cy="220" r="2"/><circle cx="570" cy="110" r="2"/><circle cx="720" cy="250" r="2"/><circle cx="850" cy="95" r="3"/><circle cx="1010" cy="190" r="2"/><circle cx="1160" cy="80" r="2"/><circle cx="1290" cy="270" r="3"/><circle cx="1450" cy="110" r="2"/><circle cx="1530" cy="350" r="2"/><circle cx="90" cy="520" r="2"/><circle cx="260" cy="650" r="3"/><circle cx="420" cy="520" r="2"/><circle cx="560" cy="770" r="2"/><circle cx="730" cy="610" r="2"/><circle cx="900" cy="780" r="3"/><circle cx="1060" cy="570" r="2"/><circle cx="1200" cy="700" r="2"/><circle cx="1390" cy="560" r="3"/><circle cx="1530" cy="800" r="2"/>
</g>
<!-- Purple black hole -->
<g transform="translate(800 455)" filter="url(#glow)">
<ellipse rx="330" ry="115" fill="none" stroke="#4b12a5" stroke-width="42" opacity=".28"/>
<ellipse rx="305" ry="105" fill="none" stroke="#7a25e8" stroke-width="28" opacity=".55"/>
<ellipse rx="280" ry="94" fill="none" stroke="#c06cff" stroke-width="11" opacity=".95"/>
<ellipse rx="245" ry="82" fill="none" stroke="#6b20d2" stroke-width="18" opacity=".8"/>
<ellipse rx="190" ry="65" fill="none" stroke="#e0a5ff" stroke-width="5" opacity=".9"/>
<ellipse rx="150" ry="52" fill="#000" stroke="#8e3cff" stroke-width="4"/>
<ellipse rx="118" ry="42" fill="#000"/>
<circle r="92" fill="#000"/>
<ellipse rx="335" ry="116" fill="none" stroke="#a24cff" stroke-width="3" opacity=".7"/>
</g>
<!-- drifting purple particles -->
<g fill="#c47aff" filter="url(#glow)">
<circle cx="530" cy="390" r="3"/><circle cx="1110" cy="510" r="3"/><circle cx="610" cy="590" r="2"/><circle cx="1000" cy="330" r="2"/><circle cx="430" cy="460" r="2"/><circle cx="1190" cy="390" r="2"/>
</g>
</svg>
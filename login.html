<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08040f">
  <title>czX — Access</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body{display:grid;place-items:center;min-height:100vh;padding:24px;overflow:hidden}
    body:before{background:radial-gradient(circle at 50% 25%,rgba(168,101,255,.3),transparent 35%),radial-gradient(circle at 50% 90%,rgba(89,39,150,.16),transparent 42%),linear-gradient(180deg,rgba(4,1,10,.05),rgba(4,1,10,.9))}
    .login-shell{width:min(440px,100%);position:relative}
    .login-glow{position:absolute;inset:-55px;border-radius:48px;background:radial-gradient(circle,rgba(142,57,255,.23),transparent 68%);filter:blur(25px);pointer-events:none}
    .login-card{position:relative;width:100%;box-sizing:border-box;padding:40px;border:1px solid rgba(180,90,255,.34);border-radius:28px;background:linear-gradient(145deg,rgba(18,9,31,.95),rgba(7,3,14,.95));box-shadow:0 25px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.05);text-align:center;backdrop-filter:blur(18px)}
    .login-brand{display:flex;justify-content:center;align-items:center;gap:8px;font-size:25px;font-weight:900;margin-bottom:18px;color:#fff}
    .login-lock{width:50px;height:50px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:rgba(142,57,255,.13);border:1px solid rgba(168,101,255,.3);color:#b985ff;font-size:22px;box-shadow:0 0 30px rgba(142,57,255,.18)}
    .login-card h1{margin:0 0 8px;font-size:28px;letter-spacing:-.6px}
    .login-card p{opacity:.62;margin:0 0 26px;font-size:13px}
    .login-input{width:100%;box-sizing:border-box;padding:15px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;outline:none;margin-bottom:12px;transition:border-color .18s,box-shadow .18s,background .18s}
    .login-input::placeholder{color:#8f849b}
    .login-input:focus{border-color:rgba(168,101,255,.7);background:rgba(255,255,255,.07);box-shadow:0 0 0 4px rgba(142,57,255,.1)}
    .login-button{width:100%;padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:linear-gradient(135deg,#9a55ff,#6e2bd3);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(111,43,211,.25);transition:transform .18s,box-shadow .18s}
    .login-button:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(111,43,211,.34)}
    .login-button:active{transform:translateY(0)}
    .login-error{min-height:20px;margin-top:12px;color:#ff9db7;font-size:13px}
  </style>
</head>
<body>
  <div class="login-shell"><div class="login-glow"></div><main class="login-card">
    <div class="login-brand"><span class="brand-star">✦</span><span>czX</span></div>
    <div class="login-lock">✦</div>
    <h1>Welcome back</h1>
    <p>Enter the password to continue.</p>
    <form id="loginForm">
      <input class="login-input" id="password" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
      <button class="login-button" type="submit">Enter czX</button>
      <div class="login-error" id="error" aria-live="polite"></div>
    </form>
  </main></div>
  <script>
    const form=document.getElementById("loginForm");
    const password=document.getElementById("password");
    const error=document.getElementById("error");
    form.addEventListener("submit",async e=>{
      e.preventDefault();
      error.textContent="";
      const response=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});
      if(response.ok){
        const params=new URLSearchParams(location.search);
        const next=params.get("next");
        location.href=next&&next.startsWith("/")&&!next.startsWith("//")?next:"/";
      }else{
        error.textContent="Incorrect password.";
        password.select();
      }
    });
  </script>
</body>
</html>

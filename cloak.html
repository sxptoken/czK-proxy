<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>czX</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d}
    iframe{display:block;width:100%;height:100%;border:0}
    #error{display:none;color:#fff;font-family:Arial,sans-serif;padding:32px;text-align:center}
  </style>
</head>
<body>
  <iframe id="cloakFrame" title="Cloaked site"></iframe>
  <div id="error">A valid http or https URL is required.</div>
  <script>
    const params=new URLSearchParams(location.search);
    const target=params.get("url");
    const name=(params.get("name")||"czX").trim().slice(0,80);
    document.title=name||"czX";
    if(target){
      try{
        const u=new URL(target);
        if(["http:","https:"].includes(u.protocol)){
          document.getElementById("cloakFrame").src="/api/proxy?url="+encodeURIComponent(u.href);
        }else{throw new Error()}
      }catch{
        document.getElementById("cloakFrame").style.display="none";
        document.getElementById("error").style.display="block";
      }
    }else{
      document.getElementById("cloakFrame").style.display="none";
      document.getElementById("error").style.display="block";
    }
  </script>
</body>
</html>

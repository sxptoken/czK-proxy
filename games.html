<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08040f">
  <title>Games • czX</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .games-page{width:min(920px,92vw);margin:auto;position:relative;z-index:2}
    .games-content{min-height:calc(100vh - 120px);padding:110px 0 80px}
    .games-card{padding:24px;border:1px solid rgba(137,58,255,.55);border-radius:18px;background:rgba(6,2,19,.78);box-shadow:0 0 45px rgba(102,35,218,.13)}
    .games-title{text-align:center;margin-bottom:22px}
    .games-title h1{margin:0;color:#fff;font-size:28px}
    .games-title h1 span{color:#a865ff}
    .games-title p{margin:9px 0 0;color:#9c91ad;font-size:13px}
    .games-card-row{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-top:22px}.games-card-row .play-hint{margin-bottom:0}.tiny-fishing-game-button{display:block;width:min(220px,100%);margin:0;padding:0;border:0;border-radius:16px;background:transparent;cursor:pointer;text-align:left;box-shadow:0 15px 45px rgba(0,0,0,.35);transition:transform .18s ease,box-shadow .18s ease}.tiny-fishing-game-button:hover{transform:translateY(-3px);box-shadow:0 20px 55px rgba(0,0,0,.45)}.tiny-fishing-game-button:focus-visible{outline:2px solid #a865ff;outline-offset:5px}.tiny-fishing-image{width:100%;height:130px;border-radius:16px;overflow:hidden;background:#08110a;border:1px solid rgba(168,101,255,.28)}.tiny-fishing-image img{display:block;width:100%;height:100%;object-fit:cover}\n    .basket-game-button{display:block;width:min(220px,100%);height:auto;margin:0;padding:0;border:0!important;border-radius:16px;background:transparent!important;appearance:none;-webkit-appearance:none;color:inherit;cursor:pointer;box-shadow:0 15px 45px rgba(0,0,0,.35);transition:transform .18s ease,box-shadow .18s ease}.basket-game-button:hover{transform:translateY(-3px);box-shadow:0 20px 55px rgba(0,0,0,.45)}.basket-game-button:focus-visible{outline:2px solid #a865ff;outline-offset:5px}.basket-image-only{width:100%;height:130px;border-radius:16px;overflow:hidden;background:#111;border:0}.basket-image-only img{display:block;width:100%;height:100%;object-fit:cover}.basket-game-button .play-hint{background:transparent!important}.play-hint{text-align:center;margin:12px 0 0;color:#bca9d1;font-size:12px}.game-player{margin:24px 0 0;border:1px solid rgba(125,50,245,.45);border-radius:16px;overflow:hidden;background:#000}.player-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;background:rgba(15,7,29,.96)}.player-header strong{font-size:13px}.close-game{border:0;border-radius:9px;background:#261832;color:#ddd;padding:8px 11px;cursor:pointer;font:inherit;font-size:11px;font-weight:800}.game-frame{display:block;width:100%;height:min(68vh,650px);border:0;background:#000}.game-note{padding:10px 14px;color:#776b84;font-size:10px;background:rgba(8,3,16,.96)}
    @media(max-width:600px){.game-frame{height:70vh}}
  </style>
  <!-- Vercel redeploy trigger - latest games layout -->
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="czX home"><span class="brand-star">✦</span><span>czX</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-link" href="/">⌂ <span>Home</span></a>
      <a class="nav-link" href="/youtube.html">▶ <span>YouTube</span></a>
      <a class="nav-link active" href="/games.html">🎮 <span>Games</span></a>
      <a class="nav-link" href="/#settings">⚙ <span>Settings</span></a>
    </nav>
  </header>
  <main class="games-page">
    <section class="games-content">
      <div class="games-card">
        <div class="games-title">
          <h1><span>🎮</span> Games</h1>
          <p>Choose a game to play inside czX.</p>
        </div>
                <div class="games-card-row">
                <button class="basket-game-button" id="basketRandomCard" type="button" aria-label="Play Basket Random">
                  <div class="basket-image-only"><img src="https://raw.githubusercontent.com/DP321827/topvaz.github.io/main/images/basket-random.webp" alt="Basket Random"></div>
                  <div class="play-hint">Click to play</div>
                </button>
                <button class="tiny-fishing-game-button" id="tinyFishingCard" type="button" aria-label="Play Tiny Fishing">
                  <div class="tiny-fishing-image"><img src="/games/tiny-fishing/tiny-fishing.png" alt="Tiny Fishing"></div>
                  <div class="play-hint">Click to play</div>
                </button>
                <div class="game-player" id="tinyFishingPlayer" hidden>
                  <div class="player-header"><strong>🎣 Tiny Fishing</strong><button class="close-game" id="closeTinyFishing" type="button">Close Game</button></div>
                  <iframe class="game-frame" id="tinyFishingFrame" title="Tiny Fishing" src="about:blank"></iframe>
                </div>

                <div class="game-player" id="gamePlayer" hidden>
                  <div class="player-header"><strong>🏀 Basket Random</strong><button class="close-game" id="closeGame" type="button">Close Game</button></div>
                  <iframe class="game-frame" id="gameFrame" title="Basket Random" src="about:blank"></iframe>
                  <div class="game-note">Basket Random runs from the game files installed during the Vercel build.</div>
                </div>

        </div>
      </div>
    </section>
  </main>
  <div class="verse-overlay" id="verseOverlay">
    <section class="verse-card" role="dialog" aria-modal="true"><div class="verse-label">BIBLE VERSE</div><h2 id="verseTitle"></h2><p id="verseText"></p></section>
  </div>
  <footer>© 2026 czX. All rights reserved.</footer>
  <script>
    const verses=[
      ["John 3:16","For God so loved the world, that he gave his only begotten Son."],
      ["Philippians 4:13","I can do all things through Christ which strengtheneth me."],
      ["Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD."],
      ["Psalm 23:1","The LORD is my shepherd; I shall not want."],
      ["Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding."]
    ];
    const verseOverlay=document.getElementById("verseOverlay");
    if(localStorage.getItem("czxVersesDisabled")!=="1"){
      const verse=verses[Math.floor(Math.random()*verses.length)];
      document.getElementById("verseTitle").textContent=verse[0];
      document.getElementById("verseText").textContent=verse[1];
      verseOverlay.hidden=false;
      setTimeout(()=>{verseOverlay.hidden=true},3000);
    }else{
      verseOverlay.hidden=true;
    }

    const tinyFishingCard=document.getElementById("tinyFishingCard");
    const tinyFishingPlayer=document.getElementById("tinyFishingPlayer");
    const tinyFishingFrame=document.getElementById("tinyFishingFrame");
    const closeTinyFishing=document.getElementById("closeTinyFishing");
    function openTinyFishing(){tinyFishingFrame.src="/games/tiny-fishing/index.html";tinyFishingPlayer.hidden=false;tinyFishingPlayer.scrollIntoView({behavior:"smooth",block:"start"});}
    function closeTinyFishingGame(){tinyFishingFrame.src="about:blank";tinyFishingPlayer.hidden=true;}
    tinyFishingCard.addEventListener("click",openTinyFishing);
    closeTinyFishing.addEventListener("click",closeTinyFishingGame);

    const basketRandomCard=document.getElementById("basketRandomCard");
    const gamePlayer=document.getElementById("gamePlayer");
    const gameFrame=document.getElementById("gameFrame");
    const closeGame=document.getElementById("closeGame");
    const basketRandomUrl="/games/basket-random/index.html";

    function openBasketRandom(){
      gameFrame.src=basketRandomUrl;
      gamePlayer.hidden=false;
      gamePlayer.scrollIntoView({behavior:"smooth",block:"start"});
    }
    function closeBasketRandom(){
      gameFrame.src="about:blank";
      gamePlayer.hidden=true;
    }
    basketRandomCard.addEventListener("click",openBasketRandom);
    closeGame.addEventListener("click",closeBasketRandom);


    const savedWallpaper=localStorage.getItem("czxWallpaper");
    if(savedWallpaper){document.body.style.backgroundImage=`url("${savedWallpaper}")`;document.body.classList.add("custom-wallpaper");}
  </script>
</body>
</html>

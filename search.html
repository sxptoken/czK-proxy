<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>czX Search</title>
<link rel="stylesheet" href="/style.css">
<style>
body{margin:0;background:#08040f;color:#fff;font-family:Arial,sans-serif}
.search-wrap{padding-top:90px}
.search-box{display:flex;padding:15px;margin:0 auto;width:min(1000px,94vw);background:#130b1d;border:1px solid rgba(153,77,255,.25);border-radius:14px}
.search-box input{flex:1;padding:12px;font-size:16px;border:1px solid #aaa;border-radius:6px 0 0 6px;background:#fff;color:#111}
.search-box button{padding:12px 20px;border:0;background:#de5833;color:#fff;font-size:16px;border-radius:0 6px 6px 0;cursor:pointer}
.results{width:min(1000px,94vw);margin:18px auto 40px}
.result{background:#130b1d;border:1px solid rgba(153,77,255,.2);border-radius:12px;padding:16px;margin-bottom:12px}
.result a{color:#b982ff;font-size:19px;text-decoration:none}.result a:hover{text-decoration:underline}
.result-url{color:#79c779;font-size:13px;margin-top:5px;word-break:break-all}
.result-snippet{color:#c8c1d0;margin-top:8px;line-height:1.45}
.yt-result{display:flex;gap:14px;align-items:flex-start}
.yt-thumb{width:220px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#08090d}
.yt-copy{min-width:0;flex:1}
.yt-badge{display:inline-block;margin-bottom:7px;padding:3px 7px;border-radius:5px;background:#5b21b6;color:#fff;font-size:11px;font-weight:700}
.search-message{width:min(1000px,94vw);margin:20px auto;color:#aaa;text-align:center}
@media(max-width:600px){.yt-result{display:block}.yt-thumb{width:100%;margin-bottom:10px}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="/" aria-label="czX home"><span class="brand-star">✦</span><span>czX</span></a>
<nav class="main-nav" aria-label="Main navigation">
<a class="nav-link" href="/">⌂ <span>Home</span></a>
<a class="nav-link" href="/games.html">🎮 <span>Games</span></a>
<a class="nav-link active" href="/search.html">🔍 <span>Search</span></a>
</nav>
</header>

<main class="search-wrap">
<form class="search-box" id="searchForm">
<input name="q" type="search" placeholder="Search DuckDuckGo..." required autocomplete="off">
<button type="submit">Search</button>
</form>
<div id="results" class="results"></div>
</main>

<script>
const form=document.getElementById("searchForm");
const input=form.querySelector('input[name="q"]');
const results=document.getElementById("results");

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

function youtubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname==="youtu.be") return u.pathname.split("/").filter(Boolean)[0]||null;
  if(u.hostname==="www.youtube.com"||u.hostname==="youtube.com"||u.hostname==="m.youtube.com"){
   if(u.pathname==="/watch") return u.searchParams.get("v");
   if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/").filter(Boolean)[1]||null;
  }
 }catch{}
 return null;
}

function renderNormal(result){
 return '<article class="result"><a href="/api/proxy?url='+encodeURIComponent(result.url)+'">'+
 escapeHtml(result.title)+'</a><div class="result-url">'+escapeHtml(result.url)+'</div>'+
 (result.snippet?'<div class="result-snippet">'+escapeHtml(result.snippet)+'</div>':'')+'</article>';
}

function renderYouTube(item){
 const id=item.id;
 const watchUrl="https://www.youtube.com/watch?v="+encodeURIComponent(id);
 const thumb="https://i.ytimg.com/vi/"+encodeURIComponent(id)+"/hqdefault.jpg";
 return '<article class="result yt-result">'+
 '<img class="yt-thumb" src="'+thumb+'" alt="">'+
 '<div class="yt-copy"><span class="yt-badge">YouTube</span>'+
 '<a href="/api/proxy?url='+encodeURIComponent(watchUrl)+'">'+escapeHtml(item.title)+'</a>'+
 (item.channelTitle?'<div class="result-url">'+escapeHtml(item.channelTitle)+'</div>':'')+
 (item.description?'<div class="result-snippet">'+escapeHtml(item.description)+'</div>':'')+
 '</div></article>';
}

async function getYouTubeResults(query){
 const response=await fetch("/api/youtube?q="+encodeURIComponent(query)+"&maxResults=10",{headers:{"Accept":"application/json"}});
 const data=await response.json();
 if(!response.ok) throw new Error(data.error||"YouTube search failed.");
 return Array.isArray(data.items)?data.items:[];
}

async function runSearch(query,updateUrl=true){
 query=query.trim();
 if(!query)return;
 if(updateUrl)history.pushState({query},"","/search.html?q="+encodeURIComponent(query));
 results.innerHTML='<div class="search-message">Searching for "'+escapeHtml(query)+'"…</div>';

 const looksLikeYouTube=/\byoutube\b/i.test(query);

 try{
  if(looksLikeYouTube){
   const ytQuery=query.replace(/\byoutube\b/ig,"").trim()||"YouTube";
   const response=await fetch("/api/youtube?q="+encodeURIComponent(ytQuery)+"&maxResults=10",{headers:{"Accept":"application/json"}});
   const data=await response.json();

   if(!response.ok){
    throw new Error(data.error||"YouTube video search failed.");
   }

   const ytResults=Array.isArray(data.items)?data.items:[];
   if(!ytResults.length){
    results.innerHTML='<div class="search-message">No YouTube videos found for "'+escapeHtml(ytQuery)+'".</div>';
    return;
   }

   results.innerHTML=ytResults.map(renderYouTube).join("");
   return;
  }

  const response=await fetch("/api/search?q="+encodeURIComponent(query),{headers:{"Accept":"application/json"}});
  const data=await response.json();
  if(!response.ok||!data.ok)throw new Error(data.error||"Search failed.");

  const normalResults=Array.isArray(data.results)?data.results:[];
  if(!normalResults.length){
   results.innerHTML='<div class="search-message">No results found for "'+escapeHtml(query)+'".</div>';
   return;
  }

  results.innerHTML=normalResults.map(renderNormal).join("");
 }catch(error){
  results.innerHTML='<div class="search-message">Search failed: '+escapeHtml(error.message)+'</div>';
 }
}

form.addEventListener("submit",e=>{e.preventDefault();runSearch(input.value);});
window.addEventListener("popstate",()=>{
 const query=new URLSearchParams(location.search).get("q")||"";
 input.value=query;if(query)runSearch(query,false);
});
const initialQuery=new URLSearchParams(location.search).get("q")||"";
if(initialQuery){input.value=initialQuery;runSearch(initialQuery,false);}
</script>
</body>
</html>

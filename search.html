<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuckDuckGo HTML • czX</title>
<meta http-equiv="refresh" content="0;url=/api/proxy?url=https%3A%2F%2Fhtml.duckduckgo.com%2Fhtml%2F">
</head>
<body>
<script>
const q=new URLSearchParams(location.search).get("q")||"";
const target="https://html.duckduckgo.com/html/"+(q?"?q="+encodeURIComponent(q):"");
location.replace("/api/proxy?url="+encodeURIComponent(target));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuckDuckGo Search • czX</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      margin: 0;
      background: #08040f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .search-wrap {
      padding-top: 90px;
    }

    .search-box {
      display: flex;
      padding: 15px;
      margin: 0 auto;
      width: min(1000px, 94vw);
      background: #130b1d;
      border: 1px solid rgba(153,77,255,.25);
      border-radius: 14px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 6px 0 0 6px;
      background: #fff;
      color: #111;
    }

    .search-box button {
      padding: 12px 20px;
      border: none;
      background: #de5833;
      color: white;
      font-size: 16px;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
    }

    .results {
      width: min(1000px, 94vw);
      margin: 18px auto 40px;
    }
    .result {
      background: #130b1d;
      border: 1px solid rgba(153,77,255,.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .result a {
      color: #b982ff;
      font-size: 19px;
      text-decoration: none;
    }
    .result a:hover { text-decoration: underline; }
    .result-url {
      color: #79c779;
      font-size: 13px;
      margin-top: 5px;
      word-break: break-all;
    }
    .result-snippet {
      color: #c8c1d0;
      margin-top: 8px;
      line-height: 1.45;
    }
    .search-message {
      width: min(1000px, 94vw);
      margin: 20px auto;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" aria-label="czX home">
    <span class="brand-star">✦</span><span>czX</span>
  </a>
  <nav class="main-nav" aria-label="Main navigation">
    <a class="nav-link" href="/">⌂ <span>Home</span></a>
    <a class="nav-link" href="/games.html">🎮 <span>Games</span></a>
    <a class="nav-link active" href="/search.html">🔍 <span>Search</span></a>
  </nav>
</header>

<main class="search-wrap">
  <form class="search-box" id="searchForm">
    <input name="q" type="search" placeholder="Search DuckDuckGo..." required autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div id="results" class="results"></div>
</main>

<script>
const form = document.getElementById("searchForm");
const input = form.querySelector('input[name="q"]');
const results = document.getElementById("results");

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

async function runSearch(query, updateUrl = true) {
  query = query.trim();
  if (!query) return;

  if (updateUrl) {
    history.pushState({query}, "", "/search.html?q=" + encodeURIComponent(query));
  }

  results.innerHTML = '<div class="search-message">Searching DuckDuckGo for "' +
    escapeHtml(query) + '"…</div>';

  try {
    const response = await fetch("/api/search?q=" + encodeURIComponent(query), {
      headers: { "Accept": "application/json" }
    });
    const data = await response.json();

    if (!response.ok || !data.ok) throw new Error(data.error || "Search failed.");

    if (!data.results.length) {
      results.innerHTML = '<div class="search-message">No results found for "' +
        escapeHtml(query) + '".</div>';
      return;
    }

    results.innerHTML = data.results.map(result => {
      const safeUrl = escapeHtml(result.url);
      return '<article class="result">' +
        '<a href="' + safeUrl + '" target="_self" rel="noopener noreferrer">' +
        escapeHtml(result.title) + '</a>' +
        '<div class="result-url">' + safeUrl + '</div>' +
        (result.snippet ? '<div class="result-snippet">' + escapeHtml(result.snippet) + '</div>' : '') +
        '</article>';
    }).join("");
  } catch (error) {
    results.innerHTML = '<div class="search-message">Search failed: ' +
      escapeHtml(error.message) + '</div>';
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  runSearch(input.value);
});

window.addEventListener("popstate", () => {
  const query = new URLSearchParams(location.search).get("q") || "";
  input.value = query;
  if (query) runSearch(query, false);
});

const initialQuery = new URLSearchParams(location.search).get("q") || "";
if (initialQuery) {
  input.value = initialQuery;
  runSearch(initialQuery, false);
}
</script>
</body>
</html>

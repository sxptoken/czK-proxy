<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuckDuckGo • czX</title>
<link rel="stylesheet" href="/style.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08040f;color:#fff;font-family:Inter,system-ui,sans-serif}
.ddg-wrap{min-height:100vh;padding-top:78px}
.ddg-bar{min-height:64px;display:flex;align-items:center;gap:12px;padding:8px 18px;background:#10091a;border-bottom:1px solid rgba(153,77,255,.28)}
.ddg-brand{font-weight:900;color:#fff;text-decoration:none;font-size:19px;white-space:nowrap}
.ddg-brand span{color:#9b4dff}
.ddg-search{display:flex;flex:1;max-width:900px;margin:auto;gap:8px}
.ddg-input{flex:1;min-width:0;padding:12px 15px;border:1px solid rgba(153,77,255,.5);border-radius:12px;background:#181020;color:#fff;outline:0;font-size:15px}
.ddg-btn{border:0;border-radius:12px;padding:0 19px;background:#7a35d1;color:#fff;font-weight:800;cursor:pointer}
.ddg-main{width:min(900px,92vw);margin:28px auto 70px}
.attribution{color:#9d90a9;font-size:12px;margin-bottom:22px}
.results{display:grid;gap:22px}
.result{padding-bottom:4px}
.result a{color:#cda8ff;font-size:19px;font-weight:750;text-decoration:none}
.result a:hover{text-decoration:underline}
.result-url{margin-top:5px;color:#7fd69a;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-snippet{margin-top:8px;color:#c8bfce;line-height:1.5;font-size:14px}
.status{color:#a99ab7;font-size:13px;margin:16px 0}
.empty{text-align:center;padding:70px 20px;color:#9d90a9}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="/" aria-label="czX home"><span class="brand-star">✦</span><span>czX</span></a>
<nav class="main-nav" aria-label="Main navigation">
<a class="nav-link" href="/">⌂ <span>Home</span></a>
<a class="nav-link" href="/games.html">🎮 <span>Games</span></a>
<a class="nav-link active" href="/search.html">🔍 <span>Search</span></a>
</nav>
</header>
<main class="ddg-wrap">
<div class="ddg-bar">
<a class="ddg-brand" href="/search.html">🦆 <span>DuckDuckGo</span></a>
<form class="ddg-search" id="searchForm">
<input class="ddg-input" id="query" placeholder="Search the web" autocomplete="off" autofocus>
<button class="ddg-btn" type="submit">Search</button>
</form>
</div>
<section class="ddg-main">
<div class="attribution">Search powered by DuckDuckGo · displayed in czX</div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
</section>
</main>
<script>
const form=document.getElementById("searchForm"),input=document.getElementById("query"),status=document.getElementById("status"),results=document.getElementById("results");
function showResults(items){
 results.innerHTML="";
 if(!items.length){results.innerHTML='<div class="empty">No results found.</div>';return}
 for(const item of items){
  const card=document.createElement("article"),link=document.createElement("a"),url=document.createElement("div"),snippet=document.createElement("div");
  card.className="result";
  link.href="/api/proxy?url="+encodeURIComponent(item.url);
  link.textContent=item.title||item.url;
  url.className="result-url";url.textContent=item.url;
  snippet.className="result-snippet";snippet.textContent=item.snippet||"";
  card.append(link,url,snippet);results.appendChild(card);
 }
}
async function runSearch(q){
 input.value=q;status.textContent="Searching…";results.innerHTML="";
 try{
  const response=await fetch("/api/search?q="+encodeURIComponent(q),{headers:{Accept:"application/json"}});
  const data=await response.json();
  if(!response.ok||!data.ok)throw new Error(data.error||"Search failed.");
  showResults(Array.isArray(data.results)?data.results:[]);
  status.textContent=data.results?.length?"Results for “"+q+"”":"No results found.";
 }catch(err){
  status.textContent="Search is temporarily unavailable.";
  results.innerHTML='<div class="empty">The search service could not be reached. Please try again.</div>';
 } 
}
form.addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();if(q)runSearch(q)});
const initial=new URLSearchParams(location.search).get("q");
if(initial)runSearch(initial);
else results.innerHTML='<div class="empty">Search the web with DuckDuckGo.</div>';
</script>
</body>
</html>

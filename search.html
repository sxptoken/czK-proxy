<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuckDuckGo • czX</title>
<link rel="stylesheet" href="/style.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08040f;color:#fff;font-family:Inter,system-ui,sans-serif}
.ddg-wrap{min-height:100vh;display:flex;flex-direction:column;padding-top:78px}
.ddg-bar{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#10091a;border-bottom:1px solid rgba(153,77,255,.28);box-shadow:0 4px 20px rgba(0,0,0,.25)}
.ddg-brand{font-weight:900;color:#fff;text-decoration:none;font-size:18px;white-space:nowrap}
.ddg-brand span{color:#9b4dff}
.ddg-search{display:flex;flex:1;max-width:900px;margin:auto;gap:8px}
.ddg-input{flex:1;min-width:0;padding:11px 14px;border:1px solid rgba(153,77,255,.5);border-radius:12px;background:#181020;color:#fff;outline:0;font-size:15px}
.ddg-btn{border:0;border-radius:12px;padding:0 17px;background:#7a35d1;color:#fff;font-weight:800;cursor:pointer}
.ddg-home{color:#bda7d0;text-decoration:none;font-size:13px}
.viewer{flex:1;width:100%;border:0;background:#fff;min-height:calc(100vh - 136px)}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="/" aria-label="czX home"><span class="brand-star">✦</span><span>czX</span></a>
<nav class="main-nav" aria-label="Main navigation">
<a class="nav-link" href="/">⌂ <span>Home</span></a>
<a class="nav-link" href="/games.html">🎮 <span>Games</span></a>
<a class="nav-link active" href="/search.html">🔍 <span>Search</span></a>
</nav>
</header>
<main class="ddg-wrap">
<div class="ddg-bar">
<a class="ddg-brand" href="/search.html">🦆 <span>DuckDuckGo</span></a>
<form class="ddg-search" id="searchForm">
<input class="ddg-input" id="query" placeholder="Search the web" autocomplete="off" autofocus>
<button class="ddg-btn" type="submit">Search</button>
</form>
<a class="ddg-home" href="/">czX</a>
</div>
<iframe class="viewer" id="viewer" title="DuckDuckGo through czX"></iframe>
</main>
<script>
const input=document.getElementById("query"),form=document.getElementById("searchForm"),viewer=document.getElementById("viewer");
function openSearch(q){
 const target=q ? "https://html.duckduckgo.com/html/?q="+encodeURIComponent(q) : "https://duckduckgo.com/";
 viewer.src="/api/proxy?url="+encodeURIComponent(target);
}
form.addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();if(q)openSearch(q)});
const q=new URLSearchParams(location.search).get("q");
openSearch(q||"");
if(q)input.value=q;
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search • czX</title><link rel="stylesheet" href="/style.css"><style>
.search-page{width:min(1000px,92vw);margin:auto;padding:120px 0 60px}.search-box{display:flex;gap:10px}.search-input{flex:1;padding:15px;border:1px solid rgba(153,77,255,.45);border-radius:14px;background:#120b1c;color:#fff;font-size:16px;outline:0}.search-button{padding:0 22px;border:0;border-radius:14px;background:#7a35d1;color:#fff;font-weight:800;cursor:pointer}.search-button:disabled{opacity:.6}.search-status{min-height:22px;margin:16px 2px;color:#a99ab7;font-size:13px}.results{display:grid;gap:12px}.result{padding:18px;border:1px solid rgba(153,77,255,.25);border-radius:16px;background:rgba(18,10,28,.82)}.result a{color:#cda8ff;font-size:18px;font-weight:700;text-decoration:none}.result-url{margin-top:5px;color:#7fd69a;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-snippet{margin-top:9px;color:#c0b5c9;line-height:1.5;font-size:14px}.empty{padding:35px;text-align:center;color:#9d90a9;border:1px dashed rgba(153,77,255,.3);border-radius:16px}
</style></head><body><main class="search-page"><h1>czX Search</h1><p>Search the web with czX.</p><form class="search-box" id="searchForm"><input class="search-input" id="query" placeholder="Search the web..." autocomplete="off" autofocus><button class="search-button" id="searchButton">Search</button></form><div class="search-status" id="status"></div><section class="results" id="results"></section></main><script>
const form=document.getElementById("searchForm"),input=document.getElementById("query"),button=document.getElementById("searchButton"),status=document.getElementById("status"),results=document.getElementById("results");
function showResults(items){results.innerHTML="";if(!items.length){results.innerHTML='<div class="empty">No results found.</div>';return}for(const item of items){const card=document.createElement("article"),link=document.createElement("a"),url=document.createElement("div"),snippet=document.createElement("div");card.className="result";link.href="/api/proxy?url="+encodeURIComponent(item.url);link.textContent=item.title||item.url;url.className="result-url";url.textContent="czX view: "+item.url;snippet.className="result-snippet";snippet.textContent=item.snippet||"";card.append(link,url,snippet);results.appendChild(card)}}
async function runSearch(q){button.disabled=true;status.textContent="Searching...";results.innerHTML="";try{const response=await fetch("/api/search?q="+encodeURIComponent(q),{headers:{Accept:"application/json"}}),data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||"Search failed.");showResults(Array.isArray(data.results)?data.results:[]);status.textContent=data.results?.length?"Found "+data.results.length+" results.":"No results found."}catch(err){status.textContent=err.message||"Search failed.";results.innerHTML='<div class="empty">The search service is unavailable right now.</div>'}finally{button.disabled=false}}
form.addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();if(q)runSearch(q)});const initial=new URLSearchParams(location.search).get("q");if(initial){input.value=initial;runSearch(initial)}
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08040f">
  <title>czX</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="czX home"><span class="brand-star">✦</span><span>czX</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-link active" href="/">⌂ <span>Home</span></a>
      <a class="nav-link" href="/games.html">🎮 <span>Games</span></a>
      <button class="nav-link settings-link" id="settingsButton" type="button">⚙ <span>Settings</span></button>
    </nav>
  </header>

  <main class="home">
    <section class="hero-content">
      <div class="hero-card"><h1>Welcome to <span>czX</span></h1></div>
      <div class="home-action-row">
        <a class="games-icon-button" href="/games.html" aria-label="Open Games" title="Games"><span class="controller-icon" aria-hidden="true">🎮</span></a>
        <button class="ai-icon-button" id="aiButton" type="button" aria-label="Open czX AI" title="AI"><span class="ai-icon" aria-hidden="true">✦</span><span>czX AI</span></button>
        <button class="calc-icon-button" id="calcButton" type="button" aria-label="Open Calculator" title="Calculator"><span aria-hidden="true">🧮</span><span>Calculator</span></button>
        <a class="chat-icon-button" href="/chat.html" aria-label="Open Chat" title="Chat"><span aria-hidden="true">💬</span><span>Chat</span></a>
      </div>
    </section>
  </main>

  <script>
    const lockSiteButton=document.getElementById("lockSiteButton");lockSiteButton.addEventListener("click",()=>{document.cookie="czx_auth=; Max-Age=0; Path=/;";window.location.href="/login.html"});
    const settingsButton=document.getElementById("settingsButton"),closeSettings=document.getElementById("closeSettings"),overlay=document.getElementById("settingsOverlay"),wallpaperFile=document.getElementById("wallpaperFile"),clearWallpaper=document.getElementById("clearWallpaper"),panicKey=document.getElementById("panicKey"),panicUrl=document.getElementById("panicUrl"),savePanic=document.getElementById("savePanic"),savedMessage=document.getElementById("savedMessage"),aboutBlankButton=document.getElementById("aboutBlankButton");
    function openSettings(){overlay.hidden=false;panicKey.value=localStorage.getItem("czxPanicKey")||"";panicUrl.value=localStorage.getItem("czxPanicUrl")||""}function closeSettingsPanel(){overlay.hidden=true}
    settingsButton.addEventListener("click",openSettings);closeSettings.addEventListener("click",closeSettingsPanel);overlay.addEventListener("click",e=>{if(e.target===overlay)closeSettingsPanel()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!overlay.hidden){closeSettingsPanel();return}const key=localStorage.getItem("czxPanicKey"),url=localStorage.getItem("czxPanicUrl");if(key&&url&&e.key.toLowerCase()===key.toLowerCase()&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName))window.location.href=url});
    wallpaperFile.addEventListener("change",()=>{const file=wallpaperFile.files[0];if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>{localStorage.setItem("czxWallpaper",reader.result);document.body.style.backgroundImage=`url("${reader.result}")`;document.body.classList.add("custom-wallpaper")};reader.readAsDataURL(file)});
    clearWallpaper.addEventListener("click",()=>{localStorage.removeItem("czxWallpaper");document.body.style.backgroundImage="";document.body.classList.remove("custom-wallpaper");wallpaperFile.value=""});
    aboutBlankButton.addEventListener("click",()=>{const blank=window.open("about:blank","_blank");if(!blank){savedMessage.textContent="Allow pop-ups for czX to use this.";return}blank.document.open();blank.document.write(`<!doctype html><html><head><meta charset="UTF-8"><title>about:blank</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe src="${location.href}" title="czX"></iframe></body></html>`);blank.document.close();savedMessage.textContent="Opened in about:blank."});
    savePanic.addEventListener("click",()=>{const key=panicKey.value.trim().slice(0,1),url=panicUrl.value.trim();if(!key||!url){savedMessage.textContent="Enter both a key and a link.";return}try{const parsed=new URL(url);if(!["http:","https:"].includes(parsed.protocol))throw new Error()}catch{savedMessage.textContent="Enter a valid http or https link.";return}localStorage.setItem("czxPanicKey",key);localStorage.setItem("czxPanicUrl",url);savedMessage.textContent=`Saved: ${key.toUpperCase()} → ${url}`});
    const profileButton=document.getElementById("profileButton"),profileAvatar=document.getElementById("profileAvatar"),accountOverlay=document.getElementById("accountOverlay"),closeAccount=document.getElementById("closeAccount"),accountForm=document.getElementById("accountForm"),accountUsername=document.getElementById("accountUsername"),accountPassword=document.getElementById("accountPassword"),accountMessage=document.getElementById("accountMessage"),accountSubmit=document.getElementById("accountSubmit"),signInTab=document.getElementById("signInTab"),signUpTab=document.getElementById("signUpTab"),accountForms=document.getElementById("accountForms"),signedInView=document.getElementById("signedInView"),accountName=document.getElementById("accountName"),signOutButton=document.getElementById("signOutButton"),accountAvatar=document.getElementById("accountAvatar"),profileFile=document.getElementById("profileFile"),profilePreviewImage=document.getElementById("profilePreviewImage"),profilePreviewFallback=document.getElementById("profilePreviewFallback"),removeProfileButton=document.getElementById("removeProfileButton"),profileMessage=document.getElementById("profileMessage");
    let accountMode="signin";
    function getStoredAccount(){try{return JSON.parse(localStorage.getItem("czxAccount")||"null")}catch{return null}}
    function updateAccountUI(){const account=getStoredAccount(),pfp=localStorage.getItem("czxProfilePicture");if(account){profileAvatar.innerHTML=pfp?`<img src="${pfp}" alt="" />`:"🙂";accountAvatar.innerHTML=pfp?`<img src="${pfp}" alt="" />`:"🙂";accountForms.hidden=true;signedInView.hidden=false;accountName.textContent=account.username;profilePreviewImage.src=pfp||"";profilePreviewImage.hidden=!pfp;profilePreviewFallback.hidden=!!pfp}else{profileAvatar.textContent="👤";accountAvatar.textContent="👤";accountForms.hidden=false;signedInView.hidden=true}}
    function openAccount(){accountOverlay.hidden=false;accountMessage.textContent="";accountPassword.value="";profileMessage.textContent="";updateAccountUI()}
    profileButton.addEventListener("click",openAccount);closeAccount.addEventListener("click",()=>{accountOverlay.hidden=true});accountOverlay.addEventListener("click",e=>{if(e.target===accountOverlay)accountOverlay.hidden=true});
    function setAccountMode(mode){accountMode=mode;signInTab.classList.toggle("active",mode==="signin");signUpTab.classList.toggle("active",mode==="signup");accountSubmit.textContent=mode==="signin"?"Sign in":"Sign up";accountPassword.autocomplete=mode==="signin"?"current-password":"new-password";accountMessage.textContent=""}
    signInTab.addEventListener("click",()=>setAccountMode("signin"));signUpTab.addEventListener("click",()=>setAccountMode("signup"));
    accountForm.addEventListener("submit",e=>{e.preventDefault();const username=accountUsername.value.trim(),password=accountPassword.value;if(username.length<2){accountMessage.textContent="Username must be at least 2 characters.";return}if(password.length<4){accountMessage.textContent="Password must be at least 4 characters.";return}const existing=getStoredAccount();if(accountMode==="signup"){if(existing){accountMessage.textContent="An account is already saved on this browser.";return}accountSubmit.disabled=true;accountMessage.textContent="Checking username...";try{await window.reserveCzxUsername(username);localStorage.setItem("czxAccount",JSON.stringify({username,password}));accountMessage.textContent="Account created.";updateAccountUI()}catch(err){accountMessage.textContent=err.message||"That username is already taken."}finally{accountSubmit.disabled=false}return}if(!existing||existing.username!==username||existing.password!==password){accountMessage.textContent="Incorrect username or password.";return}accountMessage.textContent="Signed in.";updateAccountUI()});
    profileFile.addEventListener("change",()=>{const file=profileFile.files[0];if(!file||!file.type.startsWith("image/"))return;if(file.size>3*1024*1024){profileMessage.textContent="Profile picture must be 3 MB or smaller.";profileFile.value="";return}const reader=new FileReader();reader.onload=()=>{localStorage.setItem("czxProfilePicture",reader.result);profileMessage.textContent="Profile picture saved.";updateAccountUI()};reader.readAsDataURL(file)});
    removeProfileButton.addEventListener("click",()=>{localStorage.removeItem("czxProfilePicture");profileFile.value="";profileMessage.textContent="Profile picture removed.";updateAccountUI()});signOutButton.addEventListener("click",()=>{localStorage.removeItem("czxAccount");accountUsername.value="";accountPassword.value="";setAccountMode("signin");updateAccountUI()});setAccountMode("signin");updateAccountUI();
    const savedWallpaper=localStorage.getItem("czxWallpaper");if(savedWallpaper){document.body.style.backgroundImage=`url("${savedWallpaper}")`;document.body.classList.add("custom-wallpaper")}
    const calcButton=document.getElementById("calcButton"),calcOverlay=document.getElementById("calcOverlay"),closeCalc=document.getElementById("closeCalc"),calcDisplay=document.getElementById("calcDisplay");let calcExpr="";function renderCalc(){calcDisplay.textContent=calcExpr||"0"}function calcResult(){try{const safe=calcExpr.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-");if(!/^[0-9+\-*/.() ]+$/.test(safe))throw new Error();const value=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(value))throw new Error();calcExpr=String(Math.round(value*1e12)/1e12)}catch{calcExpr="" ;calcDisplay.textContent="Error";return}renderCalc()}document.querySelectorAll("[data-calc]").forEach(b=>b.addEventListener("click",()=>{const v=b.dataset.calc;if(v==="C"){calcExpr="";renderCalc()}else if(v==="⌫"){calcExpr=calcExpr.slice(0,-1);renderCalc()}else if(v==="="){calcResult()}else{if(calcExpr.length<32)calcExpr+=v;renderCalc()}}));calcButton.addEventListener("click",()=>calcOverlay.hidden=false);closeCalc.addEventListener("click",()=>calcOverlay.hidden=true);calcOverlay.addEventListener("click",e=>{if(e.target===calcOverlay)calcOverlay.hidden=true});
    const aiButton=document.getElementById("aiButton"),aiOverlay=document.getElementById("aiOverlay"),closeAi=document.getElementById("closeAi"),aiForm=document.getElementById("aiForm"),aiInput=document.getElementById("aiInput"),aiMessages=document.getElementById("aiMessages"),aiStatus=document.getElementById("aiStatus"),aiSend=document.getElementById("aiSend");const aiHistory=[];
    function addAiMessage(text,role){const el=document.createElement("div");el.className="ai-message "+(role==="user"?"ai-user":"ai-bot");el.textContent=text;aiMessages.appendChild(el);aiMessages.scrollTop=aiMessages.scrollHeight}
    function openAi(){aiOverlay.hidden=false;setTimeout(()=>aiInput.focus(),30)}
    aiButton.addEventListener("click",openAi);closeAi.addEventListener("click",()=>aiOverlay.hidden=true);aiOverlay.addEventListener("click",e=>{if(e.target===aiOverlay)aiOverlay.hidden=true});
    aiForm.addEventListener("submit",async e=>{e.preventDefault();const message=aiInput.value.trim();if(!message)return;addAiMessage(message,"user");aiHistory.push({role:"user",content:message});aiInput.value="";aiInput.disabled=true;aiSend.disabled=true;aiStatus.textContent="Thinking...";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:aiHistory.slice(-12)})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"AI request failed.");addAiMessage(d.reply||"I couldn't generate a response.","assistant");aiHistory.push({role:"assistant",content:d.reply||""});aiStatus.textContent=""}catch(err){addAiMessage(err.message||"Something went wrong.","assistant");aiStatus.textContent="Check the AI setup in Vercel."}finally{aiInput.disabled=false;aiSend.disabled=false;aiInput.focus()}});
  </script>
</body>
</html>

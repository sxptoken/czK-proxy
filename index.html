<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>czX</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <a class="logo" href="/">czX</a>
  <form id="form">
    <input id="q" type="search" placeholder="Search the web..." autocomplete="off" required>
    <button>Search</button>
  </form>
  <div id="status"></div>
  <div id="results"></div>
</main>
<script>
const form=document.getElementById("form"), q=document.getElementById("q");
const status=document.getElementById("status"), results=document.getElementById("results");
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function search(term, push=true){
 term=term.trim(); if(!term)return;
 q.value=term; status.textContent="Searching…"; results.innerHTML="";
 if(push) history.pushState({}, "", "/?q="+encodeURIComponent(term));
 try{
  const r=await fetch("/api/search?q="+encodeURIComponent(term),{cache:"no-store"});
  const d=await r.json();
  if(!r.ok||!d.ok) throw new Error(d.error||"Search failed.");
  status.textContent=d.results.length?`Results for "${term}"`:`No results found for "${term}"`;
  results.innerHTML=d.results.map(x=>`<article>
    <a class="title" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>
    <div class="url">${esc(x.url)}</div>
    <p>${esc(x.snippet)}</p>
  </article>`).join("");
 }catch(e){status.textContent="";results.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
form.addEventListener("submit",e=>{e.preventDefault();search(q.value)});
const initial=new URLSearchParams(location.search).get("q"); if(initial) search(initial,false);
</script>
</body>
</html>

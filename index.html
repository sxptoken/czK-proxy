<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>czX Search</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header>
      <a class="logo" href="/">czX</a>
      <form id="searchForm" class="search">
        <input id="query" name="q" type="search" placeholder="Search the web..." autocomplete="off" required>
        <button type="submit">Search</button>
      </form>
    </header>

    <section id="status" class="status"></section>
    <section id="results" class="results"></section>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[c]));
    }

    async function runSearch(q, updateUrl = true) {
      q = q.trim();
      if (!q) return;

      input.value = q;
      status.textContent = "Searching...";
      results.innerHTML = "";

      if (updateUrl) {
        history.pushState({ q }, "", "/?q=" + encodeURIComponent(q));
      }

      try {
        const response = await fetch("/api/search?q=" + encodeURIComponent(q));
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Search failed.");
        }

        status.textContent = data.results.length
          ? `Results for "${q}"`
          : `No results found for "${q}"`;

        results.innerHTML = data.results.map(result => `
          <article class="result">
            <a class="title" href="${escapeHtml(result.url)}" target="_blank" rel="noopener noreferrer">
              ${escapeHtml(result.title)}
            </a>
            <div class="url">${escapeHtml(result.url)}</div>
            <p>${escapeHtml(result.snippet)}</p>
          </article>
        `).join("");
      } catch (error) {
        status.textContent = "";
        results.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      runSearch(input.value);
    });

    const initial = new URLSearchParams(location.search).get("q");
    if (initial) runSearch(initial, false);
  </script>
</body>
</html>

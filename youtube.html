<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>czX YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f9f9f9;color:#0f0f0f}
button,input{font:inherit}
.header{height:64px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;gap:22px;padding:0 20px;position:sticky;top:0;z-index:10}
.left-section{display:flex;align-items:center;gap:18px;min-width:210px}
.hamburger{width:24px;height:24px;border:0;background:transparent;cursor:pointer;font-size:24px;line-height:1}
.logo{display:flex;align-items:center;gap:5px;text-decoration:none;color:#111;font-size:22px;font-weight:700;letter-spacing:-1px}
.logo-mark{display:grid;place-items:center;width:34px;height:24px;border-radius:7px;background:#f00;color:#fff;font-size:14px}
.middle-section{display:flex;align-items:center;justify-content:center;flex:1;max-width:720px;margin:auto}
.search-wrap{display:flex;flex:1;max-width:600px}
.search-bar{height:40px;width:100%;border:1px solid #ccc;border-right:0;border-radius:22px 0 0 22px;padding:0 18px;outline:none;font-size:16px;background:#fff}
.search-bar:focus{border-color:#1a73e8;box-shadow:inset 1px 0 #1a73e8}
.search-button{height:40px;width:64px;border:1px solid #ccc;border-radius:0 22px 22px 0;background:#f2f2f2;cursor:pointer;font-size:20px}
.voice-button{margin-left:10px;width:40px;height:40px;border:0;border-radius:50%;background:#f2f2f2;cursor:pointer;font-size:17px}
.right-section{display:flex;align-items:center;gap:14px;min-width:210px;justify-content:flex-end}
.header-button{border:0;background:transparent;cursor:pointer;font-size:20px;width:38px;height:38px;border-radius:50%}
.header-button:hover,.voice-button:hover,.search-button:hover{background:#e5e5e5}
.back{color:#555;text-decoration:none;font-size:14px;white-space:nowrap}
.layout{display:flex}
.sidebar{position:sticky;top:64px;height:calc(100vh - 64px);width:220px;background:#fff;padding:14px 10px;flex-shrink:0}
.sidebar-link{display:flex;align-items:center;gap:22px;padding:12px 14px;border-radius:10px;text-decoration:none;color:#222;font-size:14px;cursor:pointer}
.sidebar-link:hover,.sidebar-link.active{background:#eee}
.sidebar-icon{width:24px;text-align:center;font-size:20px}
.content{flex:1;padding:24px 24px 50px;min-width:0}
.topic-row{display:flex;gap:10px;overflow-x:auto;margin:0 auto 24px;max-width:1400px;padding-bottom:4px}
.topic{border:0;background:#eee;padding:9px 14px;border-radius:8px;white-space:nowrap;cursor:pointer;font-size:14px}
.topic.active,.topic:hover{background:#ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:34px 16px;max-width:1400px;margin:auto}
.card{min-width:0}
.thumbnail-row{position:relative;overflow:hidden;border-radius:10px;background:#ddd;aspect-ratio:16/9}
.thumbnail-row img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.card:hover .thumbnail-row img{transform:scale(1.03)}
.video-time{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.8);color:#fff;padding:3px 5px;border-radius:4px;font-size:12px}
.video-info-grid{display:grid;grid-template-columns:42px 1fr;gap:10px;margin-top:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:700}
.video-title{margin:0 0 7px;font-size:15px;line-height:1.35;font-weight:600}
.video-title a{color:inherit;text-decoration:none}
.video-author,.video-stats{margin:0;color:#666;font-size:13px;line-height:1.45}
.result-card .thumbnail-row{display:grid;place-items:center;color:#777;font-size:38px}
.result-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:80px 20px;text-align:center;color:#666;grid-column:1/-1}
.loading{padding:80px 20px;text-align:center;color:#666;grid-column:1/-1}
@media(max-width:900px){
 .left-section{min-width:auto}.right-section{min-width:auto}.sidebar{width:78px}.sidebar-link{justify-content:center;padding:14px 5px}.sidebar-link div:last-child{display:none}.sidebar-icon{width:auto}.content{padding:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
}
@media(max-width:650px){
 .header{height:58px;padding:0 10px;gap:8px}.left-section{gap:10px}.logo-text{display:none}.right-section{display:none}.back{display:none}.middle-section{max-width:none}.voice-button{display:none}.sidebar{display:none}.content{padding:14px 10px}.grid{grid-template-columns:1fr;gap:24px}.topic-row{margin-bottom:16px}.search-button{width:54px}
}
</style>
</head>
<body>
<header class="header">
  <div class="left-section">
    <button class="hamburger" id="menuButton" type="button" aria-label="Toggle menu">☰</button>
    <a class="logo" href="/youtube.html" aria-label="czX YouTube">
      <span class="logo-mark">▶</span><span class="logo-text">czX</span>
    </a>
  </div>
  <div class="middle-section">
    <form class="search-wrap" id="searchForm">
      <input class="search-bar" id="searchInput" type="search" placeholder="Search" autocomplete="off">
      <button class="search-button" type="submit" aria-label="Search">⌕</button>
    </form>
    <button class="voice-button" type="button" aria-label="Voice search">🎙</button>
  </div>
  <div class="right-section">
    <button class="header-button" type="button" title="Create">＋</button>
    <button class="header-button" type="button" title="Apps">▦</button>
    <button class="header-button" type="button" title="Notifications">🔔</button>
    <a class="back" href="/">← czX</a>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-link active" href="/youtube.html"><span class="sidebar-icon">⌂</span><div>Home</div></a>
    <a class="sidebar-link" href="/youtube.html"><span class="sidebar-icon">⌕</span><div>Explore</div></a>
    <a class="sidebar-link" href="/youtube.html"><span class="sidebar-icon">▣</span><div>Subscriptions</div></a>
    <a class="sidebar-link" href="/youtube.html"><span class="sidebar-icon">▶</span><div>Originals</div></a>
    <a class="sidebar-link" href="/youtube.html"><span class="sidebar-icon">♪</span><div>YouTube Music</div></a>
    <a class="sidebar-link" href="/youtube.html"><span class="sidebar-icon">▤</span><div>Library</div></a>
  </aside>

  <main class="content">
    <div class="topic-row">
      <button class="topic active" type="button" data-query="">All</button>
      <button class="topic" type="button" data-query="gaming">Gaming</button>
      <button class="topic" type="button" data-query="music">Music</button>
      <button class="topic" type="button" data-query="coding">Coding</button>
      <button class="topic" type="button" data-query="minecraft">Minecraft</button>
      <button class="topic" type="button" data-query="VR">VR</button>
      <button class="topic" type="button" data-query="funny">Funny</button>
    </div>
    <section class="grid" id="videoGrid" aria-live="polite"></section>
  </main>
</div>

<script>
const videos=[
 {id:"n2RNcPRtAiY",title:"Talking Tech and AI with Google CEO Sundar Pichai!",channel:"Marques Brownlee",stats:"3.4M views · 6 months ago",time:"14:20"},
 {id:"mP0RAo9SKZk",title:"Try Not To Laugh Challenge #9",channel:"Markiplier",stats:"19M views · 4 years ago",time:"8:22"},
 {id:"FgjPQQeTh1w",title:"Crazy Tik Toks Taken Moments Before DISASTER",channel:"SSSniperWolf",stats:"12M views · 1 year ago",time:"9:13"},
 {id:"094y1Z2wpJg",title:"The Simplest Math Problem No One Can Solve",channel:"Veritasium",stats:"18M views · 4 months ago",time:"22:09"},
 {id:"86CQq3pKSUw",title:"Kadane's Algorithm to Maximum Sum Subarray Problem",channel:"CS Dojo",stats:"519K views · 5 years ago",time:"11:17"},
 {id:"yXWw0_UfSFg",title:"Try Not To Laugh Challenge",channel:"MrBeast",stats:"100M views · 2 years ago",time:"19:59"}
];

const grid=document.getElementById("videoGrid");
const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const sidebar=document.getElementById("sidebar");

function escapeHtml(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function videoUrl(id){
 return "/api/proxy?url="+encodeURIComponent("https://www.youtube.com/watch?v="+id);
}
function renderHome(){
 grid.innerHTML=videos.map(v=>`
 <article class="card">
  <div class="thumbnail-row">
   <a href="${videoUrl(v.id)}"><img src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg" alt=""></a>
   <div class="video-time">${escapeHtml(v.time)}</div>
  </div>
  <div class="video-info-grid">
   <div class="avatar">▶</div>
   <div>
    <p class="video-title"><a href="${videoUrl(v.id)}">${escapeHtml(v.title)}</a></p>
    <p class="video-author">${escapeHtml(v.channel)}</p>
    <p class="video-stats">${escapeHtml(v.stats)}</p>
   </div>
  </div>
 </article>`).join("");
}
async function searchSite(q){
 grid.innerHTML='<div class="loading">Searching czX…</div>';
 try{
  const response=await fetch("/api/search?q="+encodeURIComponent(q),{headers:{Accept:"application/json"}});
  const data=await response.json();
  if(!response.ok || !data.ok) throw new Error(data.error||"Search failed");
  const results=(data.results||[]).filter(x=>x&&x.url);
  if(!results.length){
   grid.innerHTML='<div class="empty">No results found for “'+escapeHtml(q)+'”.</div>';
   return;
  }
  grid.innerHTML=results.map(item=>{
   const url=String(item.url);
   return `
   <article class="card result-card">
    <div class="thumbnail-row">
     <a href="/api/proxy?url=${encodeURIComponent(url)}" aria-label="Open result">
      <div>🔎</div>
     </a>
    </div>
    <div class="video-info-grid">
     <div class="avatar">🔎</div>
     <div>
      <p class="video-title"><a href="/api/proxy?url=${encodeURIComponent(url)}">${escapeHtml(item.title||url)}</a></p>
      <p class="video-author result-url">${escapeHtml(url)}</p>
      <p class="video-stats">${escapeHtml(item.snippet||"")}</p>
     </div>
    </div>
   </article>`;
  }).join("");
 }catch(error){
  grid.innerHTML='<div class="empty">Search failed. Please try again.</div>';
 }
}
function runQuery(q){
 input.value=q;
 document.querySelectorAll(".topic").forEach(b=>b.classList.toggle("active",b.dataset.query===q));
 if(!q){
  history.pushState({q:""},"","/youtube.html");
  renderHome();
 }else{
  history.pushState({q},"","/youtube.html?q="+encodeURIComponent(q));
  searchSite(q);
 }
}
form.addEventListener("submit",e=>{
 e.preventDefault();
 runQuery(input.value.trim());
});
document.querySelectorAll(".topic").forEach(button=>{
 button.addEventListener("click",()=>runQuery(button.dataset.query));
});
document.getElementById("menuButton").addEventListener("click",()=>{
 sidebar.classList.toggle("collapsed");
});
window.addEventListener("popstate",()=>{
 const q=new URLSearchParams(location.search).get("q")||"";
 input.value=q;
 q?searchSite(q):renderHome();
});
const initialQuery=new URLSearchParams(location.search).get("q")||"";
input.value=initialQuery;
initialQuery?searchSite(initialQuery):renderHome();
</script>
</body>
</html>

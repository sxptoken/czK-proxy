<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08040f">
  <title>YouTube • czX</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .youtube-page{width:min(1180px,94vw);margin:auto;position:relative;z-index:2}
    .youtube-content{min-height:calc(100vh - 120px);padding:100px 0 60px}
    .youtube-card{padding:18px;border:1px solid rgba(137,58,255,.55);border-radius:20px;background:rgba(6,2,19,.82);box-shadow:0 0 45px rgba(102,35,218,.16)}
    .youtube-title{text-align:center;margin:0 0 16px}
    .youtube-title h1{margin:0;color:#fff;font-size:28px}
    .youtube-title h1 span{color:#a865ff}
    .youtube-title p{margin:8px 0 0;color:#9c91ad;font-size:13px}
    .youtube-frame{display:block;width:100%;height:min(78vh,760px);border:0;border-radius:14px;background:#08050d}
    .youtube-fallback{text-align:center;padding:14px 8px 2px;color:#9c91ad;font-size:12px}
    .youtube-fallback a{color:#c58cff;text-decoration:none;font-weight:800}
    .youtube-fallback a:hover{text-decoration:underline}
    @media(max-width:600px){.youtube-content{padding-top:80px}.youtube-card{padding:10px}.youtube-frame{height:75vh}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="czX home"><span class="brand-star">✦</span><span>czX</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-link" href="/">⌂ <span>Home</span></a>
      <a class="nav-link" href="/games.html">🎮 <span>Games</span></a>
      <a class="nav-link active" href="/youtube.html">▶ <span>YouTube</span></a>
      <a class="nav-link" href="/#settings">⚙ <span>Settings</span></a>
    </nav>
  </header>
  <main class="youtube-page">
    <section class="youtube-content">
      <div class="youtube-card">
        <div class="youtube-title">
          <h1><span>▶</span> YouTube</h1>
          <p>Watch YouTube through Norepted.</p>
        </div>
        <iframe class="youtube-frame" title="Norepted YouTube player" src="https://wea-f.github.io/Norepted/" loading="eager" allow="fullscreen; autoplay; picture-in-picture"></iframe>
        <div class="youtube-fallback">
          If the embedded player is blocked, <a href="https://wea-f.github.io/Norepted/" target="_blank" rel="noopener noreferrer">open Norepted in a new tab</a>.
        </div>
      </div>
    </section>
  </main>
  <footer>© 2026 czX. All rights reserved.</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>czX YouTube</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f8f8;color:#111}
.header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:22px;padding:0 22px;position:sticky;top:0;z-index:5}
.logo{font-size:22px;font-weight:700;text-decoration:none;color:#111;white-space:nowrap}
.logo span{color:#ff0000}
.search{display:flex;flex:1;max-width:650px;margin:auto}
.search input{width:100%;height:42px;border:1px solid #bbb;border-radius:21px 0 0 21px;padding:0 18px;font-size:16px;outline:none}
.search button{width:64px;border:1px solid #bbb;border-left:0;border-radius:0 21px 21px 0;background:#f2f2f2;font-size:18px;cursor:pointer}
.back{color:#555;text-decoration:none;font-size:14px}
.layout{display:flex}
.sidebar{width:190px;background:#fff;border-right:1px solid #ddd;min-height:calc(100vh - 64px);padding:18px 10px}
.side-link{display:block;padding:12px;border-radius:9px;color:#222;text-decoration:none}
.side-link:hover,.side-link.active{background:#eee}
.content{flex:1;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 18px;max-width:1250px;margin:auto}
.card{min-width:0}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:#ddd}
.info{display:grid;grid-template-columns:38px 1fr;gap:10px;margin-top:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-size:15px}
.title{font-size:15px;line-height:1.35;font-weight:600;margin:0 0 5px}
.meta{font-size:13px;color:#666;line-height:1.4}
.empty{padding:50px;text-align:center;color:#777}
@media(max-width:700px){
 .sidebar{display:none}.content{padding:14px}.header{padding:0 12px;gap:10px}.logo{font-size:18px}.back{display:none}.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="/youtube.html">czX <span>▶</span></a>
<form class="search" id="searchForm">
<input id="searchInput" type="search" placeholder="Search" autocomplete="off">
<button type="submit" aria-label="Search">⌕</button>
</form>
<a class="back" href="/">← czX</a>
</header>

<div class="layout">
<aside class="sidebar">
<a class="side-link active" href="/youtube.html">⌂ Home</a>
<a class="side-link" href="https://www.youtube.com/feed/subscriptions">▣ Subscriptions</a>
<a class="side-link" href="https://www.youtube.com/feed/history">◷ History</a>
</aside>

<main class="content">
<div class="grid" id="videoGrid"></div>
</main>
</div>

<script>
const videos=[
 {id:"n2RNcPRtAiY",title:"YouTube video",channel:"YouTube"},
 {id:"mP0RAo9SKZk",title:"YouTube video",channel:"YouTube"},
 {id:"FgjPQQeTh1w",title:"YouTube video",channel:"YouTube"},
 {id:"094y1Z2wpJg",title:"YouTube video",channel:"YouTube"},
 {id:"86CQq3pKSUw",title:"YouTube video",channel:"YouTube"},
 {id:"yXWw0_UfSFg",title:"YouTube video",channel:"YouTube"}
];

const grid=document.getElementById("videoGrid");
const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");

function render(list){
 if(!list.length){grid.innerHTML='<div class="empty">No videos found.</div>';return}
 grid.innerHTML=list.map(v=>`
 <article class="card">
   <a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener">
     <img class="thumb" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg" alt="">
   </a>
   <div class="info">
     <div class="avatar">▶</div>
     <div>
       <p class="title">${v.title}</p>
       <div class="meta">${v.channel}<br>YouTube</div>
     </div>
   </div>
 </article>`).join("");
}

form.addEventListener("submit",e=>{
 e.preventDefault();
 const q=input.value.trim();
 if(q) location.href="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
});

render(videos);
</script>
</body>
</html>

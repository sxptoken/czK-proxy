<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <title>czXtube</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    :root{color-scheme:dark}
    body{background:#0f0f0f;color:#f1f1f1}
    body:before{display:none}
    .yt-nav{position:sticky;top:0;z-index:20;height:64px;background:#0f0f0f;border-bottom:1px solid #272727}
    .yt-nav-inner{width:min(1280px,94vw);height:100%;margin:auto;display:flex;align-items:center;gap:22px}
    .yt-brand{color:#fff;text-decoration:none;font-size:23px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
    .yt-brand span{color:#ff0033}
    .yt-search{display:flex;flex:1;max-width:680px;margin:auto}
    .yt-search input{min-width:0;flex:1;height:40px;border:1px solid #303030;border-right:0;border-radius:22px 0 0 22px;background:#121212;color:#fff;padding:0 17px;font:inherit;outline:none}
    .yt-search input:focus{border-color:#3ea6ff}
    .yt-search button{width:62px;border:1px solid #303030;border-radius:0 22px 22px 0;background:#222;color:#fff;cursor:pointer;font-size:16px}
    .yt-search button:hover{background:#303030}
    .yt-home{color:#aaa;text-decoration:none;font-size:12px;white-space:nowrap}
    .yt-home:hover{color:#fff}
    .yt-settings{border:0;background:transparent;color:#aaa;font:inherit;font-size:12px;cursor:pointer;padding:0}.yt-settings:hover{color:#fff}
    .yt-settings-panel{position:fixed;right:3vw;top:76px;z-index:50;width:min(380px,92vw);padding:20px;border:1px solid #343434;border-radius:16px;background:rgba(18,18,18,.98);box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .yt-settings-panel[hidden]{display:none}.yt-settings-panel h2{margin:0 0 7px;font-size:18px}.yt-settings-panel p{margin:0 0 14px;color:#aaa;font-size:12px;line-height:1.5}
    .yt-file{width:100%;font-size:12px;color:#ddd}.yt-clear{margin-top:10px;border:0;border-radius:8px;background:#292929;color:#fff;padding:9px 12px;cursor:pointer}
    .yt-main{width:min(1280px,94vw);margin:0 auto;padding:28px 0 50px}
    .yt-title{margin:0 0 22px;font-size:22px;letter-spacing:-.4px}
    .yt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px}
    .yt-card{min-width:0;cursor:pointer}
    .yt-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#222}
    .yt-card h2{font-size:15px;line-height:1.35;margin:10px 0 6px;color:#f1f1f1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .yt-meta{margin:0;color:#aaa;font-size:12px;line-height:1.45}
    .yt-empty,.yt-error,.yt-loading{padding:70px 20px;text-align:center;color:#aaa}
    .yt-error{color:#ff9a9a}
    .yt-player{display:none;margin-bottom:28px}
    .yt-player.active{display:block}
    .yt-player-wrap{width:100%;max-width:980px;margin:auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
    .yt-player iframe{width:100%;height:100%;border:0}
    .yt-close{margin:12px 0 0;border:0;border-radius:8px;background:#272727;color:#fff;padding:9px 12px;cursor:pointer}
    @media(max-width:950px){.yt-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.yt-nav-inner{gap:10px}.yt-brand{font-size:18px}.yt-search{max-width:none}.yt-home{display:none}.yt-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.yt-main{padding-top:20px}}
    @media(max-width:460px){.yt-grid{grid-template-columns:1fr}.yt-search button{width:50px}}
  </style>
</head>
<body>
  <header class="yt-nav">
    <div class="yt-nav-inner">
      <a class="yt-brand" href="/"><span>▶</span> czXtube</a>
      <form class="yt-search" id="searchForm">
        <input id="searchInput" type="search" placeholder="Search czXtube" autocomplete="off" aria-label="Search czXtube">
        <button type="submit" aria-label="Search">⌕</button>
      </form>
      <a class="yt-home" href="/">czX</a>
      <button class="yt-settings" id="ytSettingsButton" type="button">⚙ Settings</button>
    </div>
  </header>

  <div class="yt-settings-panel" id="ytSettingsPanel" hidden>
    <h2>czX Settings</h2>
    <p>Set the same custom wallpaper used on the czX home screen. It is saved only in this browser.</p>
    <input class="yt-file" id="ytWallpaperFile" type="file" accept="image/*">
    <button class="yt-clear" id="ytClearWallpaper" type="button">Clear wallpaper</button>
  </div>

  <main class="yt-main">
    <div class="yt-player" id="player">
      <div class="yt-player-wrap">
        <iframe id="playerFrame" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <button class="yt-close" id="closePlayer" type="button">Close video</button>
    </div>

    <h1 class="yt-title" id="pageTitle">czXtube</h1>
    <section class="yt-grid" id="results"></section>
  </main>

  <script>
    const verses=[
      ["John 3:16","For God so loved the world, that he gave his only begotten Son."],
      ["Philippians 4:13","I can do all things through Christ which strengtheneth me."],
      ["Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD."],
      ["Psalm 23:1","The LORD is my shepherd; I shall not want."],
      ["Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding."]
    ];
    const verse=verses[Math.floor(Math.random()*verses.length)];
    const verseOverlay=document.getElementById("verseOverlay");
    document.getElementById("verseTitle").textContent=verse[0];
    document.getElementById("verseText").textContent=verse[1];
    verseOverlay.hidden=false;
    setTimeout(()=>{verseOverlay.hidden=true},5000);

    const form=document.getElementById("searchForm");
    const input=document.getElementById("searchInput");
    const results=document.getElementById("results");
    const title=document.getElementById("pageTitle");
    const player=document.getElementById("player");
    const frame=document.getElementById("playerFrame");
    const closePlayer=document.getElementById("closePlayer");

    function escapeHtml(value){
      return String(value).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function formatDate(date){
      const d=new Date(date);
      if(Number.isNaN(d.getTime())) return "";
      return new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric"}).format(d);
    }

    function openVideo(id){
      player.classList.add("active");
      frame.src="https://www.youtube.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0";
      player.scrollIntoView({behavior:"smooth",block:"start"});
    }

    function closeVideo(){
      frame.src="";
      player.classList.remove("active");
    }

    function render(items){
      if(!items.length){
        results.innerHTML='<div class="yt-empty">No videos found.</div>';
        return;
      }
      results.innerHTML=items.map(item => `
        <article class="yt-card" data-id="${escapeHtml(item.id)}">
          <img class="yt-thumb" src="${escapeHtml(item.thumbnail)}" alt="" loading="lazy">
          <h2>${escapeHtml(item.title)}</h2>
          <p class="yt-meta">${escapeHtml(item.channelTitle)}<br>${escapeHtml(formatDate(item.publishedAt))}</p>
        </article>
      `).join("");
      results.querySelectorAll(".yt-card").forEach(card=>{
        card.addEventListener("click",()=>openVideo(card.dataset.id));
      });
    }

    async function search(query){
      const q=query.trim();
      if(!q) return;
      title.textContent="Results for “"+q+"”";
      results.innerHTML='<div class="yt-loading">Loading…</div>';
      closeVideo();
      history.replaceState(null,"","/youtube.html?q="+encodeURIComponent(q));
      try{
        const response=await fetch("/api/youtube?q="+encodeURIComponent(q));
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||"Search failed.");
        render(data.items||[]);
      }catch(error){
        results.innerHTML='<div class="yt-error">'+escapeHtml(error.message)+'</div>';
      }
    }

    form.addEventListener("submit",e=>{
      e.preventDefault();
      search(input.value);
    });
    closePlayer.addEventListener("click",closeVideo);

    const ytSettingsButton=document.getElementById("ytSettingsButton");
    const ytSettingsPanel=document.getElementById("ytSettingsPanel");
    const ytWallpaperFile=document.getElementById("ytWallpaperFile");
    const ytClearWallpaper=document.getElementById("ytClearWallpaper");

    ytSettingsButton.addEventListener("click",()=>{
      ytSettingsPanel.hidden=!ytSettingsPanel.hidden;
    });
    ytWallpaperFile.addEventListener("change",()=>{
      const file=ytWallpaperFile.files[0];
      if(!file||!file.type.startsWith("image/"))return;
      const reader=new FileReader();
      reader.onload=()=>{
        localStorage.setItem("czxWallpaper",reader.result);
        document.body.style.backgroundImage=`url("${reader.result}")`;
        document.body.style.backgroundSize="cover";
        document.body.style.backgroundPosition="center";
        document.body.style.backgroundAttachment="fixed";
      };
      reader.readAsDataURL(file);
    });
    ytClearWallpaper.addEventListener("click",()=>{
      localStorage.removeItem("czxWallpaper");
      document.body.style.backgroundImage="";
      ytWallpaperFile.value="";
    });
    const savedWallpaper=localStorage.getItem("czxWallpaper");
    if(savedWallpaper){
      document.body.style.backgroundImage=`url("${savedWallpaper}")`;
      document.body.style.backgroundSize="cover";
      document.body.style.backgroundPosition="center";
      document.body.style.backgroundAttachment="fixed";
    }

    const initial=new URLSearchParams(location.search).get("q");
    if(initial){input.value=initial;search(initial)}
    else{
      title.textContent="Search YouTube";
      results.innerHTML='<div class="yt-empty">Search for a video to get started.</div>';
    }
  </script>
</body>
</html>
